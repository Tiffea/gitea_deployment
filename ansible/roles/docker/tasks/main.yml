---
- name: check docker status
  command: docker --version
  register: status
  ignore_errors: true

- name: install docker
  apt:
    name: docker.io
    state: present #verify that the programm is installed
  when: status.failed
  # checks if docker installed, if not - installs it

- name: add host to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: install docker-compose (v1)
  apt:
    name: docker-compose
    state: present

- name: container up (v2 - no hyphen)
  command: docker compose up -d #what to do
  args: #where
    chdir: /home/ubuntu/gitea_deployment